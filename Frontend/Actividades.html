<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Actividades</title>
  <link rel="stylesheet" href="CSS/Actividades.css">
</head>
<body>

  <div class="contenedor">
    <h1>Sistema de Actividades Escolares</h1>

    <!-- Aviso para errores de validación -->
    <div id="mensaje-error" class="alerta oculto"></div>

    <!-- Formulario para agregar y editar actividades -->
    <form id="form-actividad">
      <input type="hidden" id="actividad-id">

      <div class="campo">
        <label for="nombre">Nombre de la actividad:</label>
        <input type="text" id="nombre" maxlength="150" placeholder="Ej. Tarea 1 de Álgebra">
      </div>

      <div class="campo">
        <label for="materia">Materia:</label>
        <input type="text" id="materia" maxlength="100" placeholder="Ej. Matemáticas">
      </div>

      <div class="campo">
        <label for="prioridad">Prioridad:</label>
        <select id="prioridad">
          <option value="">Seleccionar:</option>
          <option value="Alta">Alta</option>
          <option value="Media">Media</option>
          <option value="Baja">Baja</option>
        </select>
      </div>

      <div class="acciones-form">
        <button type="submit" id="btn-guardar">Agregar Actividad</button>
        <button type="button" id="btn-cancelar" class="oculto">Cancelar</button>
      </div>
    </form>

    <h2>Listado de Actividades</h2>

    <!-- Tabla donde se muestran los registros -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Actividad</th>
          <th>Materia</th>
          <th>Prioridad</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-actividades">
      </tbody>
    </table>
  </div>

  <script src="JS/Actividades.js"></script>
</body>
</html>
